[package]
name = "iced_helper"
version = "0.1.0"
authors = ["Andrewkoro105"]
license = "MIT"
repository = "https://github.com/Andrewkoro105/iced_helper"
description = "A small set of auxiliary functions for working with iced"
keywords = ["iced"]
categories = ["gui"]
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["default", "image", "tokio", "advanced", "debug"] }
serde = "1.0.219"
native-dialog = "0.7.0"
futures = "0.3.31"
futures-channel = "0.3.31"
rayon = "1.10.0"
tokio = "1.44.1"
iced_futures = "0.13.2"
tracing = "0.1.41"
rustc-hash = "2.1.3"
indexmap = "2.14.0"
iced_runtime = "0.14.0"

[dev-dependencies]
tracing-subscriber = "0.3.23"
